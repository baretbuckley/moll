[workspace]
members = ["moll-macro", "moll-builder"]
resolver = "2"

[workspace.package]
version = "0.0.1"
authors = [ "Baret Buckley <buckleybaret@gmail.com>" ]
license = "MIT"
repository = "https://github.com/baretbuckley/moll"
edition = "2024"
rust-version = "1.91.1"

[workspace.dependencies]
moll-builder = { path = "moll-builder", version = "= 0.0.1" }
moll-macros = { path = "moll-macros", version = "= 0.0.1" }


